<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JeevanVault - Login</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4f7fb;
  color:#172033;
}

.login-box{
  width:92%;
  max-width:430px;
  background:white;
  padding:32px 25px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:7px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  font-size:16px;
  margin-bottom:28px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin:15px 0 7px;
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

.input:focus{
  border-color:#2563eb;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:85px;
}

.show-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:none;
  color:#2563eb;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  width:100%;
  margin-top:23px;
  padding:14px;
  border:none;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:hover{
  background:#1d4ed8;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  line-height:1.4;
}

.demo{
  margin-top:18px;
  padding:14px;
  background:#f3f4f6;
  border-radius:10px;
  text-align:center;
  color:#6b7280;
  font-size:13px;
  line-height:1.4;
}

.signup{
  text-align:center;
  margin-top:22px;
  color:#6b7280;
  font-size:14px;
}

.signup a{
  color:#2563eb;
  text-decoration:none;
  font-weight:bold;
}

</style>

</head>


<body>

<div class="login-box">

  <div class="logo">
    🔐 JeevanVault
  </div>

  <div class="subtitle">
    Secure Digital Vault
  </div>


  <form id="loginForm">

    <label>Email</label>

    <input
      class="input"
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >


    <label>Password</label>

    <div class="password-box">

      <input
        class="input"
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button
        type="button"
        class="show-password"
        onclick="togglePassword()"
      >
        Show
      </button>

    </div>


    <button
      type="submit"
      class="login-btn"
    >
      Login
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </form>


  <div class="demo">
    🔒 Login using the account you created.
  </div>


  <div class="signup">

    Don't have an account?

    <a href="signup.html">
      Create Account
    </a>

  </div>

</div>


<script>

/* SHOW / HIDE PASSWORD */

function togglePassword(){

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-password");


  if(password.type === "password"){

    password.type = "text";

    button.textContent = "Hide";

  }else{

    password.type = "password";

    button.textContent = "Show";

  }

}


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit", function(event){

  event.preventDefault();


  const email =
    document
    .getElementById("email")
    .value
    .trim()
    .toLowerCase();


  const password =
    document
    .getElementById("password")
    .value;


  const message =
    document.getElementById("message");


  /* GET SAVED ACCOUNT */

  const savedProfile =
    JSON.parse(
      localStorage.getItem(
        "jeevanVaultProfile"
      ) || "{}"
    );


  const savedEmail =
    (savedProfile.email || "")
    .trim()
    .toLowerCase();


  const savedPassword =
    localStorage.getItem(
      "jeevanVaultPassword"
    );


  /* CHECK ACCOUNT */

  if(!savedEmail){

    message.style.color =
      "#ef4444";

    message.textContent =
      "No account found. Please create an account first.";

    return;

  }


  /* CHECK EMAIL */

  if(email !== savedEmail){

    message.style.color =
      "#ef4444";

    message.textContent =
      "Email does not match the registered account.";

    return;

  }


  /* CHECK PASSWORD */

  if(password !== savedPassword){

    message.style.color =
      "#ef4444";

    message.textContent =
      "Incorrect password. Please try again.";

    return;

  }


  /* LOGIN SUCCESS */

  localStorage.setItem(
    "jeevanVaultLoggedIn",
    "true"
  );


  localStorage.setItem(
    "jeevanVaultUser",
    savedEmail
  );


  message.style.color =
    "#16a34a";

  message.textContent =
    "Login successful ✓";


  setTimeout(function(){

    window.location.href =
      "dashboard.html";

  },700);

});

</script>

</body>
</html>
