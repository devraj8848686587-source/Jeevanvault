<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JeevanVault - Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4f7fb;
}

.login-box{
  width:92%;
  max-width:400px;
  background:white;
  padding:32px 25px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  color:#111827;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:28px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  margin-bottom:18px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

.login-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:hover{
  background:#1d4ed8;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  color:#ef4444;
}

.demo{
  margin-top:20px;
  padding:12px;
  background:#f3f4f6;
  border-radius:9px;
  text-align:center;
  font-size:13px;
  color:#6b7280;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    🔐 JeevanVault
  </div>

  <div class="subtitle">
    Secure Digital Vault
  </div>

  <form id="loginForm">

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit" class="login-btn">
      Login
    </button>

    <div id="message" class="message"></div>

  </form>

  <div class="demo">
    Demo Login — कोई भी valid email और password डालकर Login दबाएँ।
  </div>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event){

  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const message = document.getElementById("message");

  if(email === "" || password === ""){
    message.textContent = "Please enter email and password.";
    return;
  }

  // Login successful
  localStorage.setItem("jeevanVaultUser", email);

  // Open Dashboard
  window.location.href = "dashboard.html";

});

</script>

</body>
</html>
