<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JeevanVault</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.container{
  width:92%;
  max-width:600px;
}

.logo{
  font-size:42px;
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  font-size:38px;
  margin-bottom:15px;
}

p{
  font-size:17px;
  line-height:1.6;
  color:#dbeafe;
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  background:white;
  color:#1d4ed8;
  padding:15px 32px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  font-size:17px;
}

.btn:hover{
  transform:scale(1.03);
}

.note{
  margin-top:25px;
  font-size:13px;
  color:#bfdbfe;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🔐 JeevanVault</div>

  <h1>Your Digital Life, Securely Stored</h1>

  <p>
    JeevanVault helps you manage your important digital
    information securely and conveniently in one place.
  </p>

  <!-- GET STARTED -->
  <a href="login.html" class="btn">
    Get Started →
  </a>

  <div class="note">
    Secure • Simple • Private
  </div>

</div>

</body>
</html>
