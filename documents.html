<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JeevanVault - Documents</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#6b7280;
  --border:#e5e7eb;
  --primary:#2563eb;
  --danger:#ef4444;
}

body{
  background:var(--bg);
  color:var(--text);
}

.header{
  background:#111827;
  color:white;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.back{
  color:white;
  text-decoration:none;
  background:#2563eb;
  padding:9px 14px;
  border-radius:8px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:25px 16px 50px;
}

.title{
  margin-bottom:22px;
}

.title h1{
  font-size:28px;
  margin-bottom:7px;
}

.title p{
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:var(--card);
  padding:18px;
  border-radius:14px;
  border:1px solid var(--border);
}

.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.upload-box{
  background:var(--card);
  border:2px dashed #cbd5e1;
  border-radius:16px;
  padding:25px;
  margin-bottom:20px;
  text-align:center;
}

.upload-box h2{
  margin-bottom:8px;
}

.upload-box p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:18px;
}

.file-input{
  display:none;
}

.upload-btn{
  display:inline-block;
  background:var(--primary);
  color:white;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.form-box{
  display:none;
  background:var(--card);
  padding:20px;
  border-radius:16px;
  border:1px solid var(--border);
  margin-bottom:20px;
}

.form-box h2{
  margin-bottom:15px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin:13px 0 7px;
}

.input,
.select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  color:var(--text);
  outline:none;
}

.save-btn{
  margin-top:18px;
  width:100%;
  padding:13px;
  border:none;
  border-radius:9px;
  background:var(--primary);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.cancel-btn{
  margin-top:10px;
  width:100%;
  padding:11px;
  border:none;
  border-radius:9px;
  background:#e5e7eb;
  cursor:pointer;
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search{
  flex:1;
}

.category-filter{
  width:180px;
}

.documents{
  display:grid;
  gap:14px;
}

.document{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
}

.doc-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.doc-icon{
  font-size:30px;
}

.doc-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:5px;
}

.doc-meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.important{
  color:#f59e0b;
  font-size:13px;
  font-weight:bold;
}

.doc-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.btn{
  border:none;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.preview{
  background:#dbeafe;
  color:#1e40af;
}

.download{
  background:#dcfce7;
  color:#166534;
}

.delete{
  background:#fee2e2;
  color:#991b1b;
}

.empty{
  background:var(--card);
  border-radius:15px;
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:50;
}

.modal-box{
  width:100%;
  max-width:800px;
  height:90vh;
  background:white;
  border-radius:15px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.modal-header{
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
}

.close{
  border:none;
  background:#fee2e2;
  color:#991b1b;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
}

.preview-content{
  flex:1;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.preview-content img{
  max-width:100%;
  max-height:100%;
}

.preview-content iframe{
  width:100%;
  height:100%;
  border:none;
}

@media(max-width:650px){

  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  .category-filter{
    width:100%;
  }

  .header{
    padding:15px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    🔐 JeevanVault
  </div>

  <a href="dashboard.html" class="back">
    ← Dashboard
  </a>

</header>


<main class="container">

  <div class="title">

    <h1>📁 My Documents</h1>

    <p>
      Upload, organize and manage your documents.
    </p>

  </div>


  <div class="stats">

    <div class="stat">
      <strong id="totalCount">0</strong>
      <span>Total Documents</span>
    </div>

    <div class="stat">
      <strong id="importantCount">0</strong>
      <span>Important</span>
    </div>

    <div class="stat">
      <strong id="categoryCount">0</strong>
      <span>Categories</span>
    </div>

  </div>


  <div class="upload-box">

    <h2>📤 Upload Document</h2>

    <p>
      Select a PDF, JPG, JPEG or PNG file.
    </p>

    <label class="upload-btn">

      Choose File

      <input
        type="file"
        id="fileInput"
        class="file-input"
        accept=".pdf,.jpg,.jpeg,.png"
        onchange="fileSelected()"
      >

    </label>

  </div>


  <div class="form-box" id="formBox">

    <h2>Document Details</h2>

    <label>Document Name</label>

    <input
      class="input"
      id="docName"
      type="text"
      placeholder="Example: Aadhaar Card"
    >


    <label>Category</label>

    <select class="select" id="docCategory">

      <option value="Aadhaar">Aadhaar</option>
      <option value="PAN">PAN</option>
      <option value="Education">Education</option>
      <option value="Bank">Bank</option>
      <option value="Insurance">Insurance</option>
      <option value="Identity">Identity</option>
      <option value="Medical">Medical</option>
      <option value="Other">Other</option>

    </select>


    <label>Expiry Date (optional)</label>

    <input
      class="input"
      id="expiryDate"
      type="date"
    >


    <label>

      <input
        type="checkbox"
        id="important"
      >

      ⭐ Mark as Important

    </label>


    <button
      class="save-btn"
      onclick="saveDocument()"
    >
      💾 Save Document
    </button>


    <button
      class="cancel-btn"
      onclick="cancelUpload()"
    >
      Cancel
    </button>

  </div>


  <div class="toolbar">

    <input
      class="input search"
      id="search"
      type="search"
      placeholder="🔍 Search documents..."
      oninput="renderDocuments()"
    >


    <select
      class="select category-filter"
      id="categoryFilter"
      onchange="renderDocuments()"
    >

      <option value="All">All Categories</option>
      <option value="Aadhaar">Aadhaar</option>
      <option value="PAN">PAN</option>
      <option value="Education">Education</option>
      <option value="Bank">Bank</option>
      <option value="Insurance">Insurance</option>
      <option value="Identity">Identity</option>
      <option value="Medical">Medical</option>
      <option value="Other">Other</option>

    </select>

  </div>


  <div
    class="documents"
    id="documents"
  ></div>

</main>


<!-- PREVIEW MODAL -->

<div
  class="modal"
  id="previewModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <strong id="previewTitle">
        Document Preview
      </strong>

      <button
        class="close"
        onclick="closePreview()"
      >
        ✕ Close
      </button>

    </div>

    <div
      class="preview-content"
      id="previewContent"
    ></div>

  </div>

</div>


<script>

/* STORAGE KEY */

const STORAGE_KEY =
  "jeevanVaultDocuments";


/* GET DOCUMENTS */

function getDocuments(){

  return JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

}


/* SAVE DOCUMENTS */

function setDocuments(documents){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(documents)
  );

}


/* FILE SELECTED */

function fileSelected(){

  const input =
    document.getElementById("fileInput");

  if(!input.files.length){

    return;

  }

  const file =
    input.files[0];


  document.getElementById("docName").value =
    file.name
    .replace(/\.[^/.]+$/,"");


  document.getElementById("formBox")
    .style.display = "block";

}


/* CANCEL */

function cancelUpload(){

  document.getElementById("fileInput").value = "";

  document.getElementById("docName").value = "";

  document.getElementById("expiryDate").value = "";

  document.getElementById("important").checked = false;

  document.getElementById("formBox")
    .style.display = "none";

}


/* SAVE DOCUMENT */

function saveDocument(){

  const input =
    document.getElementById("fileInput");


  if(!input.files.length){

    alert("Please choose a file first.");

    return;

  }


  const file =
    input.files[0];


  const name =
    document.getElementById("docName")
    .value.trim();


  if(!name){

    alert("Please enter document name.");

    return;

  }


  /*
    Browser storage has limited space.
    We convert the selected file to Base64.
  */

  const reader =
    new FileReader();


  reader.onload = function(event){

    const documents =
      getDocuments();


    const documentData = {

      id:Date.now(),

      name:name,

      category:
        document.getElementById(
          "docCategory"
        ).value,

      expiry:
        document.getElementById(
          "expiryDate"
        ).value,

      important:
        document.getElementById(
          "important"
        ).checked,

      fileName:file.name,

      fileType:file.type,

      fileData:event.target.result,

      createdAt:
        new Date().toISOString()

    };


    documents.push(documentData);

    setDocuments(documents);


    cancelUpload();

    renderDocuments();

    updateStats();


    alert(
      "Document saved successfully ✓"
    );

  };


  reader.readAsDataURL(file);

}


/* RENDER */

function renderDocuments(){

  const container =
    document.getElementById("documents");


  const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();


  const category =
    document.getElementById(
      "categoryFilter"
    ).value;


  const documents =
    getDocuments();


  const filtered =
    documents.filter(function(doc){

      const matchesSearch =
        doc.name
          .toLowerCase()
          .includes(search) ||
        doc.fileName
          .toLowerCase()
          .includes(search);


      const matchesCategory =
        category === "All" ||
        doc.category === category;


      return matchesSearch &&
             matchesCategory;

    });


  if(filtered.length === 0){

    container.innerHTML = `

      <div class="empty">

        📂

        <h3 style="margin:10px 0;">
          No documents found
        </h3>

        <p>
          Upload a document to see it here.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered.map(function(doc){

      const expiryText =
        doc.expiry
        ? "Expiry: " + doc.expiry
        : "No expiry date";


      const important =
        doc.important
        ? `<div class="important">⭐ Important</div>`
        : "";


      return `

        <div class="document">

          <div class="doc-top">

            <div>

              <div class="doc-name">
                ${escapeHTML(doc.name)}
              </div>

              <div class="doc-meta">

                📂 ${escapeHTML(doc.category)}
                <br>

                📄 ${escapeHTML(doc.fileName)}
                <br>

                📅 ${expiryText}

              </div>

              ${important}

            </div>

            <div class="doc-icon">
              ${getFileIcon(doc.fileType)}
            </div>

          </div>


          <div class="doc-actions">

            <button
              class="btn preview"
              onclick="previewDocument(${doc.id})"
            >
              👁️ Preview
            </button>


            <button
              class="btn download"
              onclick="downloadDocument(${doc.id})"
            >
              📥 Download
            </button>


            <button
              class="btn delete"
              onclick="deleteDocument(${doc.id})"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* FILE ICON */

function getFileIcon(type){

  if(type === "application/pdf"){

    return "📕";

  }

  if(type.startsWith("image/")){

    return "🖼️";

  }

  return "📄";

}


/* PREVIEW */

function previewDocument(id){

  const documents =
    getDocuments();


  const doc =
    documents.find(function(item){

      return item.id === id;

    });


  if(!doc){

    return;

  }


  document.getElementById(
    "previewTitle"
  ).textContent =
    doc.name;


  const content =
    document.getElementById(
      "previewContent"
    );


  content.innerHTML = "";


  if(doc.fileType === "application/pdf"){

    const iframe =
      document.createElement("iframe");

    iframe.src =
      doc.fileData;

    content.appendChild(iframe);

  }

  else if(doc.fileType.startsWith("image/")){

    const img =
      document.createElement("img");

    img.src =
      doc.fileData;

    img.alt =
      doc.name;

    content.appendChild(img);

  }

  else{

    content.innerHTML =
      "<p>Preview is not available for this file type.</p>";

  }


  document.getElementById(
    "previewModal"
  ).style.display =
    "flex";

}


/* CLOSE PREVIEW */

function closePreview(){

  document.getElementById(
    "previewModal"
  ).style.display =
    "none";


  document.getElementById(
    "previewContent"
  ).innerHTML = "";

}


/* DOWNLOAD */

function downloadDocument(id){

  const documents =
    getDocuments();


  const doc =
    documents.find(function(item){

      return item.id === id;

    });


  if(!doc){

    return;

  }


  const link =
    document.createElement("a");

  link.href =
    doc.fileData;

  link.download =
    doc.fileName;

  document.body.appendChild(link);

  link.click();

  link.remove();

}


/* DELETE */

function deleteDocument(id){

  const confirmDelete =
    confirm(
      "Are you sure you want to delete this document?"
    );


  if(!confirmDelete){

    return;

  }


  let documents =
    getDocuments();


  documents =
    documents.filter(function(doc){

      return doc.id !== id;

    });


  setDocuments(documents);

  renderDocuments();

  updateStats();

}


/* STATISTICS */

function updateStats(){

  const documents =
    getDocuments();


  const important =
    documents.filter(function(doc){

      return doc.important;

    }).length;


  const categories =
    new Set(
      documents.map(function(doc){

        return doc.category;

      })
    );


  document.getElementById(
    "totalCount"
  ).textContent =
    documents.length;


  document.getElementById(
    "importantCount"
  ).textContent =
    important;


  document.getElementById(
    "categoryCount"
  ).textContent =
    categories.size;

}


/* ESCAPE HTML */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* INITIAL LOAD */

renderDocuments();

updateStats();

</script>

</body>
</html>
