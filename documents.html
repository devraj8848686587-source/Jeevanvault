<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JeevanVault - Documents</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

.header{
  background:#111827;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.back{
  color:white;
  text-decoration:none;
  background:#2563eb;
  padding:9px 14px;
  border-radius:8px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 16px;
}

h1{
  margin-bottom:7px;
}

.subtitle{
  color:#6b7280;
  margin-bottom:25px;
}

.form-box,
.documents-box{
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  margin-bottom:22px;
}

.form-box h2,
.documents-box h2{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin:13px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:none;
  cursor:pointer;
}

.add-btn{
  width:100%;
  margin-top:18px;
  padding:13px;
  background:#2563eb;
  color:white;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
}

.document{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
  margin-top:14px;
}

.document h3{
  margin-bottom:7px;
}

.category{
  display:inline-block;
  background:#eef2ff;
  color:#3730a3;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  margin-bottom:10px;
}

.details{
  color:#6b7280;
  font-size:14px;
  margin-bottom:12px;
  white-space:pre-wrap;
}

.delete-btn{
  background:#ef4444;
  color:white;
  padding:8px 12px;
  border-radius:7px;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:20px 0;
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">🔐 JeevanVault</div>

  <a href="dashboard.html" class="back">
    ← Dashboard
  </a>

</header>


<main class="container">

  <h1>📁 My Documents</h1>

  <p class="subtitle">
    Add and manage your important documents.
  </p>


  <!-- ADD DOCUMENT -->

  <div class="form-box">

    <h2>Add Document</h2>

    <label>Document Name</label>

    <input
      type="text"
      id="docName"
      placeholder="Example: Aadhaar Card"
    >


    <label>Category</label>

    <select id="docCategory">

      <option value="Identity">Identity</option>

      <option value="Education">Education</option>

      <option value="Banking">Banking</option>

      <option value="Certificate">Certificate</option>

      <option value="Other">Other</option>

    </select>


    <label>Details</label>

    <textarea
      id="docDetails"
      placeholder="Enter document details..."
    ></textarea>


    <button class="add-btn" onclick="addDocument()">
      + Add Document
    </button>

  </div>


  <!-- DOCUMENT LIST -->

  <div class="documents-box">

    <h2>Saved Documents</h2>

    <div id="documentList"></div>

  </div>

</main>


<script>

function getDocuments(){

  return JSON.parse(
    localStorage.getItem("jeevanVaultDocuments") || "[]"
  );

}


function saveDocuments(documents){

  localStorage.setItem(
    "jeevanVaultDocuments",
    JSON.stringify(documents)
  );

}


function addDocument(){

  const name =
    document.getElementById("docName").value.trim();

  const category =
    document.getElementById("docCategory").value;

  const details =
    document.getElementById("docDetails").value.trim();


  if(name === ""){

    alert("Please enter document name.");

    return;

  }


  const documents = getDocuments();


  documents.push({

    id: Date.now(),

    name: name,

    category: category,

    details: details

  });


  saveDocuments(documents);


  document.getElementById("docName").value = "";

  document.getElementById("docDetails").value = "";


  displayDocuments();

}


function deleteDocument(id){

  const documents = getDocuments().filter(
    document => document.id !== id
  );


  saveDocuments(documents);

  displayDocuments();

}


function displayDocuments(){

  const list =
    document.getElementById("documentList");

  const documents = getDocuments();


  if(documents.length === 0){

    list.innerHTML =
      '<div class="empty">No documents added yet.</div>';

    return;

  }


  list.innerHTML = documents.map(document => `

    <div class="document">

      <h3>📄 ${escapeHTML(document.name)}</h3>

      <span class="category">
        ${escapeHTML(document.category)}
      </span>

      <div class="details">
        ${escapeHTML(document.details || "No details added.")}
      </div>

      <button
        class="delete-btn"
        onclick="deleteDocument(${document.id})"
      >
        Delete
      </button>

    </div>

  `).join("");

}


function escapeHTML(text){

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


displayDocuments();

</script>

</body>
</html>
