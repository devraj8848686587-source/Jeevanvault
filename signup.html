<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JeevanVault - Sign Up</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4f7fb;
  color:#172033;
}

.signup-box{
  width:92%;
  max-width:430px;
  background:white;
  padding:30px 25px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin-bottom:7px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin:14px 0 7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

.signup-btn{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:none;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.signup-btn:hover{
  background:#1d4ed8;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

.login-link{
  text-align:center;
  margin-top:20px;
  font-size:14px;
  color:#6b7280;
}

.login-link a{
  color:#2563eb;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="signup-box">

  <div class="logo">
    🔐 JeevanVault
  </div>

  <div class="subtitle">
    Create your account
  </div>

  <form id="signupForm">

    <label>Full Name</label>

    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Mobile Number</label>

    <input
      type="tel"
      id="mobile"
      placeholder="Enter mobile number"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      required
    >

    <label>Confirm Password</label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
      required
    >

    <button type="submit" class="signup-btn">
      Create Account
    </button>

    <div id="message" class="message"></div>

  </form>

  <div class="login-link">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>


<script>

document.getElementById("signupForm")
.addEventListener("submit", function(event){

  event.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const message =
    document.getElementById("message");


  if(password !== confirmPassword){

    message.style.color = "#ef4444";

    message.textContent =
      "Passwords do not match.";

    return;

  }


  if(password.length < 6){

    message.style.color = "#ef4444";

    message.textContent =
      "Password must be at least 6 characters.";

    return;

  }


  const account = {

    name:name,
    email:email,
    mobile:mobile

  };


  localStorage.setItem(
    "jeevanVaultProfile",
    JSON.stringify(account)
  );


  localStorage.setItem(
    "jeevanVaultUser",
    email
  );
localStorage.setItem(
  "jeevanVaultPassword",
  password
);

  message.style.color = "#16a34a";
tf
  message.textContent =
    "Account created successfully ✓";


  setTimeout(function(){

    window.location.href =
      "dashboard.html";

  },1000);

});

</script>

</body>
</html>
